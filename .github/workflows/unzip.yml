
name: Unzip Website ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository files
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "No ZIP file found in repository root"
            exit 1
          fi

          mkdir -p _unpacked
          unzip -q "$ZIP_FILE" -d _unpacked

          shopt -s dotglob nullglob
          entries=(_unpacked/*)
          SOURCE="_unpacked"

          if [[ ${#entries[@]} -eq 1 && -d "${entries[0]}" ]]; then
            SOURCE="${entries[0]}"
          fi

          rsync -a --exclude='.git' --exclude='.github' "$SOURCE"/ ./

          rm -rf _unpacked "$ZIP_FILE"

          if [[ ! -f index.html ]]; then
            echo "index.html was not found in the extracted root"
            exit 1
          fi

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Extract website ZIP"
            git push
          fi
